workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [verify, publish]

variables:
  UPLOAD_TESTFLIGHT:
    value: 'false'
    options: ['false', 'true']
    description: 'Upload the tested iOS build to TestFlight (protected refs only)'

default:
  interruptible: true

android:
  stage: verify
  tags: [linux]
  timeout: 40m
  script:
    - bash scripts/ci-android.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths: [dist/android/, reports/android/]
    reports:
      junit: reports/android/tests/*.xml

apple:
  stage: verify
  tags: [macos]
  timeout: 40m
  script:
    - bash scripts/ci-apple.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths: [dist/apple/, reports/apple.xml]
    reports:
      junit: reports/apple.xml

testflight:
  stage: publish
  tags: [macos]
  needs: [apple, android]
  timeout: 60m
  interruptible: false
  rules:
    - if: '$UPLOAD_TESTFLIGHT == "true" && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - bash scripts/ci-testflight.sh
  after_script:
    - bash scripts/cleanup-testflight-key.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths: [dist/testflight/]

release-cleanup:
  stage: publish
  tags: [macos]
  needs: []
  timeout: 5m
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - python3 scripts/cleanup-testflight-files.py audit
  artifacts:
    when: always
    expire_in: 7 days
    paths: [dist/testflight-cleanup/]

testflight-invite:
  stage: publish
  tags: [macos]
  needs: []
  timeout: 10m
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - GITLABIO_PUBLISH_OPERATION=distribute bash scripts/ci-testflight.sh
  after_script:
    - bash scripts/cleanup-testflight-key.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths: [dist/testflight/]
